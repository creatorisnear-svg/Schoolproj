<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RolePlayManager promo renderer</title>
<!--
  The RolePlayManager promo video and ads, drawn on a canvas.
  marketing/render.mjs opens this in headless Edge, one job at a time:
    ?job=video&w=1080&h=1920   every frame as a PNG, piped into ffmpeg
    ?job=still&still=og        one designed still (see STILLS)
    ?job=still&t=6.6           one frame of the video
  Edit the words in the scene functions and run render.mjs again. The
  drawing helpers are in kit.js, shared with cybercom.html.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@300;800&display=block" rel="stylesheet">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="kit.js"></script>
<script>
/** The Safety Network warning, as the bot posts it. Returns its height. */
function safetyMessage(x, y, w, s, t, alpha, draw = true) {
  const pad = 26 * s, av = 72 * s, ex = x + pad + av + 20 * s, ew = x + w - pad - ex;
  const ip = 22 * s, inner = ew - ip * 2 - 6 * s;
  const lineS = 25 * s;
  const d2 = wrapLines('They are banned in 3 other servers in the network.', inner, font(lineS, 500)).length;
  let eh = ip + 36 * s + 6 * s;
  eh += lineS * 1.35 + d2 * lineS * 1.35 + 14 * s;
  eh += 30 * s + 2 * (lineS * 1.35 + 8 * s);
  const banned = t >= 3.1;
  if (banned) eh += 66 * s;
  eh += 30 * s + ip;
  const btnH = 56 * s;
  const h = pad + 44 * s + eh + (banned ? 0 : 16 * s + btnH) + pad;
  if (!draw) return h;

  ctx.save();
  ctx.globalAlpha *= alpha;
  rr(x, y, w, h, 22 * s); ctx.fillStyle = C.dBg; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 2 * s; ctx.stroke();
  drawLogo(x + pad + av / 2, y + pad + av / 2, av);
  drawText('RolePlayManager', ex, y + pad + 2 * s, { size: 28 * s, weight: 700, color: '#fff' });
  const bx = ex + textWidth('RolePlayManager', 28 * s, 700) + 12 * s;
  rr(bx, y + pad + 4 * s, 58 * s, 28 * s, 6 * s); ctx.fillStyle = C.dBlurple; ctx.fill();
  drawText('APP', bx + 29 * s, y + pad + 18 * s, { size: 17 * s, weight: 800, color: '#fff', align: 'center', baseline: 'middle' });
  drawText('Today at 9:41 PM', bx + 72 * s, y + pad + 8 * s, { size: 20 * s, weight: 500, color: C.dMuted });

  const ey = y + pad + 44 * s;
  rr(ex, ey, ew, eh, 10 * s); ctx.fillStyle = C.dEmbed; ctx.fill();
  rr(ex, ey, 6 * s, eh, 3 * s); ctx.fillStyle = '#ed4245'; ctx.fill();
  let cy = ey + ip;
  const ix = ex + 6 * s + ip;
  drawText('Safety Network warning', ix, cy, { size: 28 * s, weight: 800, color: '#fff' });
  cy += 42 * s;
  drawText('xRaiderx just joined.', ix, cy, { size: lineS, weight: 700, color: '#fff' });
  cy += lineS * 1.35;
  drawText('They are banned in 3 other servers in the network.', ix, cy, { size: lineS, weight: 500, color: C.dText, maxW: inner, lh: 1.35 });
  cy += d2 * lineS * 1.35 + 14 * s;
  drawText('Reasons given', ix, cy, { size: 22 * s, weight: 800, color: C.dText });
  cy += 30 * s;
  ['Raiding the server', 'Trolling during a session'].forEach((r, i) => {
    const p = prog(t, 0.9 + i * 0.3, 0.4);
    ctx.save(); ctx.globalAlpha *= p;
    rr(ix, cy + 2 * s, 5 * s, lineS * 1.2, 3 * s); ctx.fillStyle = C.dGray; ctx.fill();
    drawText(r, ix + 18 * s, cy, { size: lineS, weight: 500, color: C.dText });
    ctx.restore();
    cy += lineS * 1.35 + 8 * s;
  });
  if (banned) {
    const p = prog(t, 3.1, 0.4);
    ctx.save(); ctx.globalAlpha *= p;
    drawText('Banned', ix, cy + 6 * s, { size: 22 * s, weight: 800, color: '#fff' });
    drawText('by @Mod just now', ix, cy + 34 * s, { size: 22 * s, weight: 500, color: C.dText });
    ctx.restore();
    cy += 66 * s;
  }
  drawText('A warning is not proof. Check before you act.', ix, cy + 6 * s, { size: 18 * s, weight: 500, color: C.dMuted });

  if (!banned) {
    const by = ey + eh + 16 * s;
    const pb = prog(t, 1.6, 0.4);
    const pressed = t >= 2.75;
    const press = pressed ? 0.94 : 1;
    [['Ban', C.dRed], ['Kick', C.dGray]].forEach(([label, color], i) => {
      const bw = textWidth(label, 25 * s, 600) + 60 * s;
      const bx2 = ex + i * (textWidth('Ban', 25 * s, 600) + 60 * s + 12 * s);
      ctx.save(); ctx.globalAlpha *= pb;
      const sc = i === 0 ? press : 1;
      ctx.translate(bx2 + bw / 2, by + btnH / 2); ctx.scale(sc, sc);
      rr(-bw / 2, -btnH / 2, bw, btnH, 8 * s); ctx.fillStyle = color; ctx.fill();
      if (i === 0 && pressed) { ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill(); }
      drawText(label, 0, 0, { size: 25 * s, weight: 600, color: '#fff', align: 'center', baseline: 'middle' });
      ctx.restore();
    });
    // A pointer that presses Ban.
    const pp = prog(t, 2.1, 0.6);
    if (t > 2.0) {
      const tx = ex + (textWidth('Ban', 25 * s, 600) + 60 * s) / 2 + 6 * s, ty = by + btnH / 2 + 6 * s;
      const px = tx + (1 - pp) * 160 * s, py = ty + (1 - pp) * 120 * s;
      pointer(px, py, 34 * s, Math.min(1, (t - 2.0) * 4) * (pressed ? 0.9 : 1));
    }
  }
  ctx.restore();
  return h;
}

// ── Mock web CAD on a phone ─────────────────────────────────────────────────
function phone(x, y, w, h, alpha, screen) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 60 * S; ctx.shadowOffsetY = 20 * S;
  rr(x, y, w, h, 64 * S); ctx.fillStyle = '#0d0f13'; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 3 * S; ctx.strokeStyle = '#2a2e37'; ctx.stroke();
  const m = 14 * S;
  ctx.save();
  rr(x + m, y + m, w - m * 2, h - m * 2, 52 * S); ctx.clip();
  ctx.fillStyle = C.bg; ctx.fillRect(x + m, y + m, w - m * 2, h - m * 2);
  screen(x + m, y + m, w - m * 2, h - m * 2);
  ctx.restore();
  rr(x + w / 2 - 70 * S, y + 30 * S, 140 * S, 36 * S, 18 * S); ctx.fillStyle = '#000'; ctx.fill();
  ctx.restore();
}

function cadScreen(x, y, w, h, t) {
  const s = w / 440;
  const px = x + 24 * s, iw = w - 48 * s;
  drawText('9:41', x + 40 * s, y + 24 * s, { size: 22 * s, weight: 700, color: '#fff' });
  let cy = y + 86 * s;
  drawLogo(px + 24 * s, cy + 24 * s, 48 * s);
  drawText('RPM CAD', px + 62 * s, cy + 2 * s, { size: 26 * s, weight: 800, color: '#fff' });
  drawText('Los Santos RP', px + 62 * s, cy + 32 * s, { size: 18 * s, weight: 500, color: C.muted });
  chip('10-8', px + iw, cy + 24 * s, { size: 17 * s, align: 'right', dot: C.green });
  cy += 80 * s;
  ['Records', 'Calls', 'BOLOs', 'Warrants'].forEach((tab, i) => {
    const tx = px + i * 100 * s;
    drawText(tab, tx, cy, { size: 20 * s, weight: i === 0 ? 700 : 500, color: i === 0 ? '#fff' : C.muted });
    if (i === 0) { rr(tx, cy + 32 * s, textWidth(tab, 20 * s, 700), 3 * s, 2 * s); ctx.fillStyle = '#fff'; ctx.fill(); }
  });
  ctx.fillStyle = C.border; ctx.fillRect(px, cy + 36 * s, iw, 1.5 * s);
  cy += 62 * s;

  rr(px, cy, iw, 62 * s, 14 * s); ctx.fillStyle = C.input; ctx.fill();
  ctx.lineWidth = 2 * s; ctx.strokeStyle = t > 0.9 ? '#3a3f4b' : C.border; ctx.stroke();
  const typed = 'ABC123'.slice(0, Math.floor(clamp((t - 0.9) / 0.75) * 6 + 0.0001));
  if (typed) {
    drawText(typed, px + 22 * s, cy + 31 * s, { size: 26 * s, weight: 700, fam: MONO, color: '#fff', baseline: 'middle' });
    if (Math.floor(t * 2.4) % 2 === 0) { ctx.fillStyle = '#fff'; ctx.fillRect(px + 26 * s + textWidth(typed, 26 * s, 700, MONO), cy + 16 * s, 2.5 * s, 30 * s); }
  } else {
    drawText('Search a plate or a name', px + 22 * s, cy + 31 * s, { size: 22 * s, weight: 500, color: C.muted, baseline: 'middle' });
  }
  cy += 84 * s;

  const p1 = prog(t, 1.85, 0.45);
  ctx.save(); ctx.globalAlpha *= p1; ctx.translate(0, (1 - p1) * 20 * s);
  rr(px, cy, iw, 196 * s, 16 * s); ctx.fillStyle = C.card; ctx.fill(); ctx.strokeStyle = C.border; ctx.lineWidth = 2 * s; ctx.stroke();
  drawText('VEHICLE', px + 22 * s, cy + 20 * s, { size: 16 * s, weight: 800, color: C.muted, spacing: 2 * s });
  drawText('ABC123', px + 22 * s, cy + 46 * s, { size: 34 * s, weight: 700, fam: MONO, color: '#fff' });
  drawText('Bravado Buffalo, black', px + 22 * s, cy + 92 * s, { size: 21 * s, weight: 600, color: C.text });
  drawText('Registered to Tony Russo', px + 22 * s, cy + 122 * s, { size: 19 * s, weight: 500, color: C.muted });
  const pb = 0.75 + 0.25 * Math.sin(t * 8);
  const bw = badge('STOLEN', px + 22 * s, cy + 150 * s, s, C.red, t > 2.3 ? pb : 0.9);
  badge('BOLO', px + 32 * s + bw, cy + 150 * s, s, C.amber);
  ctx.restore();
  cy += 214 * s;

  const p2 = prog(t, 2.6, 0.45);
  ctx.save(); ctx.globalAlpha *= p2; ctx.translate(0, (1 - p2) * 20 * s);
  rr(px, cy, iw, 168 * s, 16 * s); ctx.fillStyle = C.card; ctx.fill(); ctx.strokeStyle = C.border; ctx.lineWidth = 2 * s; ctx.stroke();
  drawText('OWNER', px + 22 * s, cy + 20 * s, { size: 16 * s, weight: 800, color: C.muted, spacing: 2 * s });
  drawText('Tony Russo', px + 22 * s, cy + 46 * s, { size: 28 * s, weight: 800, color: '#fff' });
  drawText('Warrant: armed robbery', px + 22 * s, cy + 88 * s, { size: 20 * s, weight: 700, color: C.red });
  drawText('2 prior arrests  ·  1 open ticket', px + 22 * s, cy + 120 * s, { size: 18 * s, weight: 500, color: C.muted });
  ctx.restore();
  cy += 188 * s;

  const p3 = prog(t, 3.2, 0.45);
  ctx.save(); ctx.globalAlpha *= p3;
  const half = (iw - 14 * s) / 2;
  rr(px, cy, half, 58 * s, 12 * s); ctx.fillStyle = C.card; ctx.fill(); ctx.strokeStyle = C.border; ctx.lineWidth = 2 * s; ctx.stroke();
  drawText('Issue ticket', px + half / 2, cy + 29 * s, { size: 20 * s, weight: 700, color: C.text, align: 'center', baseline: 'middle' });
  rr(px + half + 14 * s, cy, half, 58 * s, 12 * s); ctx.fillStyle = '#fff'; ctx.fill();
  drawText('Arrest report', px + half + 14 * s + half / 2, cy + 29 * s, { size: 20 * s, weight: 800, color: C.bg, align: 'center', baseline: 'middle' });
  ctx.restore();
}

// ── Scenes ──────────────────────────────────────────────────────────────────
function sceneHook(t) {
  const L = PORTRAIT;
  const g1 = L ? ['GTA 6 hits', 'PS5 and Xbox', 'on November 19.'] : ['GTA 6 hits PS5 and Xbox', 'on November 19.'];
  const g2 = L ? ['Is your RP', 'server ready?'] : ['Is your RP server ready?'];
  const s1 = (L ? 104 : 92) * S, s2 = (L ? 128 : 118) * S;
  const total = g1.length * s1 * 1.1 + 70 * S + g2.length * s2 * 1.12;
  let y = (H - total) / 2 - (L ? 80 * S : 10 * S);
  let k = 0;
  const dim = 1 - 0.45 * prog(t, 1.4, 0.5);
  g1.forEach((line) => {
    ctx.save(); ctx.globalAlpha *= dim;
    staggerLine(line, W / 2, y, s1, t, 0.1, 0.11, k);
    ctx.restore();
    k += line.split(' ').length; y += s1 * 1.1;
  });
  y += 70 * S;
  g2.forEach((line, i) => {
    if (i === g2.length - 1) emphasisLine(line, W / 2, y, s2, t, 1.5 + i * 0.12);
    else staggerLine(line, W / 2, y, s2, t, 1.5, 0.1, 0);
    y += s2 * 1.12;
  });
}

function sceneBrand(t) {
  const L = PORTRAIT;
  const cy = L ? H * 0.36 : H * 0.34;
  const size = (L ? 360 : 290) * S;
  const p = prog(t, 0.0, 0.7);
  ctx.save(); ctx.globalAlpha *= p; glowAt(W / 2, cy, size * 1.1, 'rgba(255,255,255,0.10)'); ctx.restore();
  ctx.save(); ctx.translate(W / 2, cy); ctx.scale(0.86 + 0.14 * p, 0.86 + 0.14 * p); drawLogo(0, 0, size, p); ctx.restore();
  const wy = cy + size / 2 + (L ? 120 : 110) * S;
  const pw = prog(t, 0.4, 0.6);
  wordmark(W / 2, wy + (1 - pw) * 20 * S, (L ? 74 : 84) * S, pw);
  const pt = prog(t, 0.75, 0.6);
  drawText('The Discord bot for console GTA roleplay', W / 2, wy + 44 * S, { size: (L ? 40 : 38) * S, weight: 500, color: C.muted, align: 'center', alpha: pt, maxW: 940 * S, lh: 1.3 });
  chipRow(['PS5', 'Xbox', 'Free to add'], W / 2, wy + (L ? 200 : 150) * S, 30 * S, prog(t, 1.1, 0.6));
}

// What is said on the radio, as captions. The spoken versions, in the bot's
// own voice, come from /dev/promo-voice (routes/dev.js); the timeline from
// render.mjs says when each one plays. Officers always start with "Dispatch":
// the AI dispatcher only answers sentences that do.
const CAPTIONS = {
  call: { who: 'Dispatch', text: 'Attention all units. 911 emergency call. Shots fired at Grove Street. All available units respond.' },
  respond: { who: 'Unit 12', text: 'Dispatch, Unit 12, show me responding to call 14.' },
  respondAck: { who: 'Dispatch', text: 'Copy Unit 12, 10-76 to call 14.' },
  plate: { who: 'Unit 7', text: 'Dispatch, run plate ABC123.' },
  plateReply: { who: 'Dispatch', text: 'Plate ABC123 comes back to Tony Russo, black 2019 Bravado Buffalo. Record shows WANTED for armed robbery.' },
};
const MEMBERS = [
  { name: 'Dispatch', logo: true, app: true },
  { name: 'Unit 12', initials: '12', color: '#3b5bdb' },
  { name: 'Unit 7', initials: '7', color: '#2b8a3e' },
];

/** A patrol channel and its radio lines, which appear as they are spoken. */
function radioScene(t, id, spec) {
  const L = PORTRAIT;
  const w = (L ? 900 : 700) * S;
  const x = visualX(w);
  const lines = TL.radio[id];
  const now = lines.find((r) => t >= r.from && t < r.end);
  const speaking = now ? CAPTIONS[now.id].who : null;
  const cardH = 26 * S * 2 + 60 * S + MEMBERS.length * 76 * S;
  const lineHs = lines.map((r) => radioLine(0, 0, w, S, CAPTIONS[r.id].who, CAPTIONS[r.id].text, 1, '#fff', 1, false));
  const gap = 16 * S;
  const totalH = cardH + 28 * S + lineHs.reduce((a, b) => a + b + gap, 0);
  const bottom = textBlock(t, spec, L ? portraitTop(spec, totalH, 64 * S) : null);
  let y = L ? bottom + 64 * S : (H - totalH) / 2;
  const pc = prog(t, 0.25, 0.5);
  voiceCard(x, y + (1 - pc) * 40 * S, w, S, MEMBERS, speaking, t, pc);
  y += cardH + 28 * S;
  lines.forEach((r, i) => {
    const c = CAPTIONS[r.id];
    const p = prog(t, r.at - 0.15, 0.35);
    const said = clamp((t - r.at) / Math.max(0.1, (r.end - r.at) * 0.92));
    if (p > 0) radioLine(x, y + (1 - p) * 24 * S, w, S, c.who, c.text, p, c.who === 'Dispatch' ? C.green : C.blue, said);
    y += lineHs[i] + gap;
  });
}

function sceneCall911(t) {
  radioScene(t, 'call911', { eyebrow: 'AI voice dispatch', title: '911 calls, read out on your patrol radio', body: 'Officers hear every call the moment it comes in, and answer by voice.' });
}

function scenePlate(t) {
  radioScene(t, 'plate', { eyebrow: 'AI voice dispatch', title: 'Run plates by voice', body: 'Start with "Dispatch" and ask. It checks your CAD and answers on the radio.' });
}

function sceneCad(t) {
  const bottom = textBlock(t, { eyebrow: 'Web CAD', title: 'A full CAD on your phone', body: 'Run plates, write arrest reports and issue warrants, right next to the TV.' });
  const L = PORTRAIT;
  const pw = (L ? 540 : 460) * S, ph = (L ? 1040 : 900) * S;
  const px = visualX(pw);
  const pIn = prog(t, 0.2, 0.7);
  const py = (L ? bottom + 70 * S : (H - ph) / 2) + (1 - pIn) * 140 * S;
  phone(px, py, pw, ph, pIn, (sx, sy, sw, sh) => cadScreen(sx, sy, sw, sh, t));
  if (L) {
    const g = ctx.createLinearGradient(0, H - 420 * S, 0, H - 170 * S);
    g.addColorStop(0, 'rgba(10,11,14,0)'); g.addColorStop(1, 'rgba(10,11,14,1)');
    ctx.fillStyle = g; ctx.fillRect(0, H - 420 * S, W, 420 * S);
  }
}

// ── Mock server directory ───────────────────────────────────────────────────
const DIR_SERVERS = [
  { name: 'Los Santos Roleplay', initials: 'LS', color: '#1d4ed8', members: '1,240', platforms: 'PS5 · Xbox Series X|S', tags: ['Serious RP', 'Law Enforcement', 'Fire and EMS'], votes: 312, featured: true },
  { name: 'Blaine County RP', initials: 'BC', color: '#b45309', members: '860', platforms: 'PS5', tags: ['Gangs', 'Economy', 'Civilian'], votes: 188 },
  { name: 'Vice City Roleplay', initials: 'VC', color: '#be185d', members: '410', platforms: 'PS5 · Xbox Series X|S', tags: ['Getting ready for GTA 6', 'New server'], votes: 96 },
];

function serverCard(x, y, w, h, s, srv, alpha, pressed) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  rr(x, y, w, h, 16 * s); ctx.fillStyle = C.card; ctx.fill();
  ctx.lineWidth = 2 * s; ctx.strokeStyle = srv.featured ? 'rgba(251,191,36,0.55)' : C.border; ctx.stroke();
  const r = 34 * s, cx = x + 22 * s + r, cy = y + h / 2;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = srv.color; ctx.fill();
  drawText(srv.initials, cx, cy, { size: 24 * s, weight: 800, color: '#fff', align: 'center', baseline: 'middle' });
  const tx = cx + r + 20 * s;
  drawText(srv.name, tx, y + 20 * s, { size: 26 * s, weight: 800, color: '#fff' });
  if (srv.featured) badge('FEATURED', tx + textWidth(srv.name, 26 * s, 800) + 12 * s, y + 18 * s, s, C.amber);
  drawText(srv.members + ' members  ·  ' + srv.platforms, tx, y + 56 * s, { size: 18 * s, weight: 500, color: C.muted });
  let chipX = tx;
  srv.tags.forEach((tag) => { chipX += chip(tag, chipX, y + 104 * s, { size: 15 * s, align: 'left' }) + 8 * s; });
  const bw = 104 * s, bh = 48 * s, bx = x + w - 20 * s - bw, by = cy - 4 * s;
  drawText(srv.votes + ' votes', bx + bw / 2, by - 30 * s, { size: 17 * s, weight: 600, color: C.muted, align: 'center' });
  ctx.save();
  ctx.translate(bx + bw / 2, by + bh / 2);
  if (pressed) ctx.scale(0.94, 0.94);
  rr(-bw / 2, -bh / 2, bw, bh, 10 * s); ctx.fillStyle = pressed ? '#d4d4d4' : '#fff'; ctx.fill();
  drawText('Join', 0, 0, { size: 20 * s, weight: 800, color: C.bg, align: 'center', baseline: 'middle' });
  ctx.restore();
  ctx.restore();
  return { joinX: bx + bw / 2, joinY: by + bh / 2 };
}

function sceneDirectory(t) {
  const L = PORTRAIT;
  const w = (L ? 940 : 760) * S;
  const x = visualX(w);
  const cardH = 150 * S, gap = 14 * S, barH = 64 * S, headH = 96 * S;
  const panelH = barH + headH + DIR_SERVERS.length * (cardH + gap) + 12 * S;
  const spec = { eyebrow: 'Server directory', title: 'Get found by new players', body: 'PS5 and Xbox players browse roleplaymanager.xyz/servers to find a server to join. Listing yours is free.' };
  const bottom = textBlock(t, spec, L ? portraitTop(spec, panelH, 64 * S) : null);
  const p = prog(t, 0.25, 0.6);
  const y = (L ? bottom + 64 * S : (H - panelH) / 2) + (1 - p) * 40 * S;

  ctx.save();
  ctx.globalAlpha *= p;
  rr(x, y, w, panelH, 20 * S); ctx.fillStyle = '#0e1015'; ctx.fill();
  ctx.lineWidth = 2 * S; ctx.strokeStyle = '#2a2e37'; ctx.stroke();
  ['#f87171', '#fbbf24', '#34d399'].forEach((c, i) => { ctx.beginPath(); ctx.arc(x + 30 * S + i * 24 * S, y + barH / 2, 7 * S, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); });
  rr(x + 120 * S, y + 14 * S, w - 150 * S, barH - 28 * S, (barH - 28 * S) / 2); ctx.fillStyle = C.input; ctx.fill();
  drawText('roleplaymanager.xyz/servers', x + 142 * S, y + barH / 2, { size: 18 * S, weight: 600, color: C.muted, baseline: 'middle' });
  ctx.fillStyle = C.border; ctx.fillRect(x, y + barH, w, 1.5 * S);

  const hy = y + barH + headH / 2;
  rr(x + 20 * S, hy - 26 * S, L ? 330 * S : 260 * S, 52 * S, 12 * S); ctx.fillStyle = C.input; ctx.fill();
  drawText('Search servers', x + 40 * S, hy, { size: 19 * S, weight: 500, color: C.muted, baseline: 'middle' });
  let fx = x + (L ? 366 : 296) * S;
  ['PS5', 'Xbox', 'Serious RP', 'GTA 6'].forEach((f, i) => {
    fx += chip(f, fx, hy, { size: 16 * S, align: 'left', fill: i === 0 ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)' }) + 8 * S;
  });

  let cy = y + barH + headH;
  let join = null;
  DIR_SERVERS.forEach((srv, i) => {
    const pc = prog(t, 0.55 + i * 0.18, 0.45);
    const pos = serverCard(x + 16 * S, cy + (1 - pc) * 24 * S, w - 32 * S, cardH, S, srv, pc, i === 0 && t >= 3.2 && t < 3.55);
    if (i === 0) join = pos;
    cy += cardH + gap;
  });
  ctx.restore();

  // A player heads for Join on the featured server.
  if (join && t > 2.2) {
    const pp = prog(t, 2.3, 0.8);
    pointer(join.joinX + 4 * S + (1 - pp) * 220 * S, join.joinY + 6 * S + (1 - pp) * 160 * S, 34 * S, Math.min(1, (t - 2.2) * 4));
  }
}

function sceneSafety(t) {
  const L = PORTRAIT;
  const w = (L ? 940 : 720) * S;
  const x = visualX(w);
  const p = prog(t, 0.35, 0.6);
  const h = safetyMessage(x, 0, w, S, 0, 1, false);
  const spec = { eyebrow: 'Safety Network', title: 'Spot trolls the moment they join', body: 'Servers share their bans, so your staff are warned when someone banned elsewhere joins.' };
  const bottom = textBlock(t, spec, L ? portraitTop(spec, h, 70 * S) : null);
  const y = (L ? bottom + 70 * S : (H - h) / 2) + (1 - p) * 50 * S;
  safetyMessage(x, y, w, S, t, p);
}

const FEATURES = ['Priority cooldowns', 'Session recaps', 'Applications', 'Economy and jobs', 'Tickets and strikes', 'Verification', 'Patrol hours', 'Web dashboard'];

function featureCard(x, y, w, h, label, alpha) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  rr(x, y, w, h, 18 * S); ctx.fillStyle = C.card; ctx.fill();
  ctx.strokeStyle = C.border; ctx.lineWidth = 2 * S; ctx.stroke();
  const r = 18 * S;
  check(x + 26 * S + r, y + h / 2, r);
  drawText(label, x + 26 * S + r * 2 + 18 * S, y + h / 2, { size: (PORTRAIT ? 31 : 27) * S, weight: 600, color: C.text, baseline: 'middle' });
  ctx.restore();
}

function sceneFeatures(t) {
  const L = PORTRAIT;
  const cw = (L ? 450 : 340) * S, ch = (L ? 116 : 98) * S, gap = 18 * S;
  const gw = cw * 2 + gap, gh = ch * 4 + gap * 3;
  const spec = { eyebrow: 'And the rest', title: 'Everything your RP server runs on' };
  const bottom = textBlock(t, spec, L ? portraitTop(spec, gh, 70 * S) : null);
  const x0 = visualX(gw);
  const y0 = L ? bottom + 70 * S : (H - gh) / 2;
  FEATURES.forEach((label, i) => {
    const p = prog(t, 0.3 + i * 0.11, 0.45);
    featureCard(x0 + (i % 2) * (cw + gap), y0 + Math.floor(i / 2) * (ch + gap) + (1 - p) * 26 * S, cw, ch, label, p);
  });
}

function sceneCta(t) {
  const L = PORTRAIT;
  const size = (L ? 250 : 190) * S;
  const cy = L ? H * 0.29 : H * 0.25;
  const p = prog(t, 0.05, 0.6);
  drawLogo(W / 2, cy, size * (0.9 + 0.1 * p), p);
  let y = cy + size / 2 + 56 * S;
  const pt = prog(t, 0.3, 0.6);
  y += drawText('Add it to your server free', W / 2, y + (1 - pt) * 20 * S, { size: (L ? 90 : 84) * S, weight: 800, color: '#fff', align: 'center', alpha: pt, maxW: (L ? 940 : 1600) * S, lh: 1.08 });
  y += 44 * S;
  const us = (L ? 54 : 48) * S;
  urlPill('roleplaymanager.xyz', W / 2, y + us * 0.95, us, prog(t, 0.6, 0.6));
  y += us * 1.9 + 44 * S;
  drawText('Premium from $5 a month, with a 7 day free trial', W / 2, y, { size: (L ? 34 : 32) * S, weight: 500, color: C.muted, align: 'center', alpha: prog(t, 0.9, 0.6), maxW: 940 * S });
  y += (L ? 120 : 92) * S;
  chipRow(['PS5', 'Xbox', 'Ready for GTA 6'], W / 2, y, 28 * S, prog(t, 1.15, 0.6));
}

// ── Stills: ads and the link preview image ──────────────────────────────────
const STILLS = {
  // 1200 x 630: what Discord, X and others show when someone shares the site.
  og() {
    background(0, 0);
    drawLogo(W * 0.2, H / 2, 300 * S);
    const x = W * 0.2 + 210 * S;
    wordmark(x, H / 2 - 70 * S, 92 * S, 1, 'left');
    drawText('The Discord bot for console GTA roleplay on PS5 and Xbox', x, H / 2 - 30 * S, { size: 44 * S, weight: 500, color: C.muted, maxW: W - x - 70 * S, lh: 1.3 });
    let cx = x;
    ['Web CAD', 'AI voice dispatch', 'Server directory'].forEach((l) => { cx += chip(l, cx, H / 2 + 150 * S, { size: 30 * S, align: 'left' }) + 14 * S; });
  },
  // 1080 x 1080: the GTA 6 hook.
  gta6() {
    background(1.2, 1);
    drawText('GTA 6 hits PS5 and Xbox on November 19.', W / 2, 150 * S, { size: 76 * S, weight: 800, color: C.text, align: 'center', maxW: 900 * S, lh: 1.1 });
    staggerLine('Is your RP', W / 2, 420 * S, 112 * S, 99, 0, 0, 0);
    emphasisLine('server ready?', W / 2, 545 * S, 112 * S, 99, 0);
    drawLogo(W / 2, 808 * S, 120 * S);
    wordmark(W / 2, 935 * S, 50 * S);
    drawText('roleplaymanager.xyz', W / 2, 965 * S, { size: 32 * S, weight: 600, color: C.muted, align: 'center' });
  },
  // 1080 x 1080: the AI dispatcher.
  dispatch() {
    background(2, 0.5);
    drawText('AI VOICE DISPATCH', W / 2, 90 * S, { size: 26 * S, weight: 700, color: C.muted, align: 'center', spacing: 4 * S });
    drawText('An AI dispatcher for your PS5 and Xbox RP server', W / 2, 140 * S, { size: 66 * S, weight: 800, color: '#fff', align: 'center', maxW: 940 * S, lh: 1.08 });
    const w = 900 * S, x = (W - w) / 2;
    const h = voiceCard(x, 330 * S, w, S, MEMBERS, 'Dispatch', 1.7);
    radioLine(x, 330 * S + h + 24 * S, w, S, 'Dispatch', CAPTIONS.call.text, 1, C.green);
    drawText('Free to add at roleplaymanager.xyz', W / 2, 990 * S, { size: 32 * S, weight: 600, color: C.muted, align: 'center' });
  },
  // 1080 x 1920: a story or status post.
  story() {
    background(0, 0);
    drawLogo(W / 2, 330 * S, 230 * S);
    wordmark(W / 2, 560 * S, 72 * S);
    drawText('The Discord bot for console GTA roleplay on PS5 and Xbox', W / 2, 600 * S, { size: 38 * S, weight: 500, color: C.muted, align: 'center', maxW: 860 * S, lh: 1.3 });
    const items = ['AI voice dispatch on your patrol radio', 'A full web CAD on your phone', 'The Safety Network against trolls', 'Session recaps after every patrol', 'Priority, economy and applications', 'A free server directory'];
    items.forEach((label, i) => {
      const y = 790 * S + i * 104 * S;
      check(170 * S, y, 24 * S);
      drawText(label, 216 * S, y, { size: 38 * S, weight: 600, color: C.text, baseline: 'middle' });
    });
    drawText('Add it to your server free', W / 2, 1490 * S, { size: 64 * S, weight: 800, color: '#fff', align: 'center' });
    urlPill('roleplaymanager.xyz', W / 2, 1640 * S, 50 * S, 1);
  },
};

// Scene times come from render.mjs (/timeline.json), because the two radio
// scenes last as long as their voice clips do.
startPromo({
  draw: {
    hook: sceneHook, brand: sceneBrand, call911: sceneCall911, plate: scenePlate,
    cad: sceneCad, directory: sceneDirectory, safety: sceneSafety, features: sceneFeatures, cta: sceneCta,
  },
  lights: { hook: 1, call911: 0.55, plate: 0.35 },
  marked: ['call911', 'plate', 'cad', 'directory', 'safety', 'features'],
  stills: STILLS,
});
</script>
